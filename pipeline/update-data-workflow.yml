name: Update teardown database

on:
  schedule:
    # Every Monday 09:00 UTC — discover the latest products, rebuild the bundle.
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Discover new products
        run: python3 pipeline/discover.py

      - name: Draft device entries (needs OPENAI_API_KEY secret)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python3 pipeline/enrich.py

      - name: Rebuild app bundle
        run: python3 pipeline/build_bundle.py

      - name: Commit changes
        run: |
          git config user.name "chipscope-bot"
          git config user.email "chipscope-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "chore(data): weekly teardown database update"
          git push
